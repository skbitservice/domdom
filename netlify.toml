# Netlify deployment for DOMDOM (Step 12: security testing + deployment).
#
# This repo is an npm-workspaces monorepo, so the build runs from the root:
# `npm run build:web` type-checks and builds apps/web, and the result is
# published from apps/web/dist. No server code is deployed — the backend is
# Supabase (DB / Auth / Realtime / Storage), all on its own free tier.

[build]
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"          # package.json requires engines.node >= 20
  NPM_FLAGS = "--include=dev"  # vite / typescript / tailwind are devDependencies

# React Router serves every route client-side, so unknown paths must fall back
# to index.html — without this, a hard refresh on /app/reels or /post/:id 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed asset filenames are safe to cache forever; the HTML must not be.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
